name: Feature
description: New behaviour, described by testable acceptance criteria.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and explicitly what is out.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: One per observable behaviour, numbered AC-1, AC-2, each as WHEN <situation> THEN <observable result>, with the lowest test level that proves it.
      placeholder: |
        - AC-1 (unit): WHEN ... THEN ...
        - AC-2 (instrumented): WHEN ... THEN ...
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions and risks
      description: Linked ADRs, dependencies and open risks.
