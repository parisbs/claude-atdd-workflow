name: metrics-donation

on:
  pull_request:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, ready_for_review, locked, unlocked, review_requested, review_request_removed, auto_merge_enabled, auto_merge_disabled, enqueued, dequeued, milestoned, demilestoned]

permissions:
  contents: read

jobs:
  donation:
    name: Check metrics donation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Fetch the fork's data through the public base repository, without checking out its code.
      - name: Fetch pull request data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/heads/metrics-donation-head"
      - name: Validate donation with the base scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/metrics-donation-check.mjs --base "$BASE_SHA" --head refs/heads/metrics-donation-head --event "$GITHUB_EVENT_PATH"
